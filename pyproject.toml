[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-feishu-bot"
version = "0.1.0"
description = "Feishu bot that archives Douyin video analysis into Wiki and Base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "lark-oapi>=1.4,<2",
  # video-agent's local Whisper normalization dependency. The Bot imports the
  # existing video-agent source directly but owns a separate virtualenv.
  "opencc-python-reimplemented>=0.1.7,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[project.scripts]
video-feishu-bot = "video_feishu_bot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_feishu_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
